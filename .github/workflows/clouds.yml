# Builds this hour's cloud map for the app and puts it on the "live" branch, which the app reads.
# The live branch is replaced on every run, so it never grows. To stop: Actions tab, "clouds", "...", Disable workflow
# (the app then falls back to its other cloud sources).
name: clouds
on:
  # NOAA posts each hour's satellite pictures about 35-40 minutes after the hour starts. GitHub starts scheduled jobs
  # late and skips some (at one start an hour it ran once in thirteen hours), so this asks four times an hour; a start
  # that finds the latest hour already published stops after a minute without doing anything.
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
    inputs:
      only_if_new:
        description: "Stop early if the latest hour is already published (what the scheduled starts do)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tools/clouds.py', '.github/workflows/clouds.yml']
permissions:
  contents: write
concurrency:
  group: clouds
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pillow netCDF4 pygrib
      # the last published map: reused beyond the satellites' view if the weather model cannot be fetched
      - run: curl -sfL -o previous.jpg "https://raw.githubusercontent.com/${{ github.repository }}/live/clouds.jpg" || true
      # what is published now, read from the branch itself (the raw file address can answer from a copy minutes old)
      - run: git fetch -q --depth 1 origin live && git show FETCH_HEAD:clouds.json > live.json || true
      # (the log is published next to the map, so a bad hour can be looked into)
      - run: mkdir -p site && set -o pipefail && python tools/clouds.py --out site --previous previous.jpg ${{ (github.event_name == 'schedule' || inputs.only_if_new) && '--unless live.json' || '' }} 2>&1 | tee site/log.txt
      - name: Publish
        run: |
          if [ ! -f site/clouds.jpg ]; then echo "nothing new to publish"; exit 0; fi
          cd site
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Clouds for $(python3 -c "import json; print(json.load(open('clouds.json'))['time'])")"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
