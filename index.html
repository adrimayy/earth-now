<body>
<canvas id="c"></canvas>
<script>
"use strict";
{
/* ==========================================================================
   Earth Now — a physically based, naked-eye view of the Earth right now.
   Lengths in the shaders are in Earth equatorial radii (6378.137 km).
   World frame = Earth-fixed: +y north pole, lon 0 at +z, lon 90E at +x.
   Light is carried in photometric units: illuminance in lux, luminance in cd/m².
   ========================================================================== */

const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
out vec4 outColor;
uniform int   uMode;                 // 0 display, 1 log-luminance (for eye adaptation)
uniform vec2  uRes;
uniform float uPix;                  // radians per framebuffer pixel
uniform vec3  uCam, uVR, uVU, uVB;   // camera position and view basis
uniform vec3  uSun;                  // unit vector to the Sun
uniform float uEsun;                 // solar illuminance at Earth (lux)
uniform float uSunRad;               // Sun angular radius (rad)
uniform float uDec;                  // solar declination (deg)
uniform vec3  uMoon;                 // Moon centre (Earth radii)
uniform vec3  uMX, uMY, uMZ;         // lunar body axes (east, north, sub-mean-Earth)
uniform float uEmoon;                // moonlight illuminance at Earth (lux)
uniform float uEearth;               // earthshine illuminance at the Moon (lux)
uniform mat3  uW2G;                  // world -> galactic
uniform vec4  uGd[40]; uniform vec3 uGc[40]; // glare sources: apparent direction + angular size, illuminance at eye (lux, rgb)
uniform int   uGn;
uniform float uSigma, uScot, uBlack; // eye adaptation state; uBlack: discounted veiling haze (cd/m²)
uniform vec4  uFlow; uniform vec3 uOff;
uniform vec4  uStorm[8];
uniform sampler2D tDay, tLights, tTopo, tRug, tWater, tMoon, tMW, tCloud, tSeason, tLive, tMoonH, tMoonB;
uniform vec3 uEcl;                   // north pole of the plane of the planets (ecliptic)
uniform float uKp;                   // how disturbed Earth's magnetic field is right now (0 calm .. 9 great storm)
uniform float uMoonHi;               // the Moon's relief and sharper map, loaded on approaching it: 0 = not there, 1 = in use
uniform float uNoCloud;             // test hook
uniform float uQ;                   // 1: still frame (full quality), 0: moving (lighter marching)
uniform float uTexR;                // elevation-map texels per radian
uniform vec3  uMonth;                // month a, month b (0-11), blend
uniform float uLive, uLiveAge;       // live cloud map loaded?, its age (hours)

const float PI = 3.14159265359;
const float FL  = 0.0033528107;           // WGS84 flattening
const float EY  = 1.0/(1.0-FL);
const float KM  = 1.0/6378.137;
const float HR  = 8.0*KM, HM = 1.2*KM;    // scale heights
const vec3  BR  = vec3(7.189, 13.762, 32.518)*6.378137; // Rayleigh scattering per Earth radius, integrated over sRGB channels
const float BMS = 3.996*6.378137, BME = 4.40*6.378137;  // Mie scattering / extinction
const vec3  BO  = vec3(0.650, 1.881, 0.085)*6.378137;   // ozone absorption
const float OZC = 25.0*KM, OZW = 15.0*KM;
const float ATM = 100.0*KM;
const float RMOON = 1737.4/6378.137;

// ---------------------------------------------------------------- noise
float hash(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(mix(mix(hash(i),             hash(i+vec3(1,0,0)), f.x),
                 mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                 mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p, float oct){
  float a = 0.5, s = 0.0;
  for (int i = 0; i < 12; i++){
    float w = clamp(oct - float(i), 0.0, 1.0);
    if (w <= 0.0) { s += a*1.1; break; }
    s += a*mix(0.5, noise(p), w);
    p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= 0.56;
  }
  return s;
}
vec3 rotAxis(vec3 v, vec3 k, float a){ float c = cos(a), s = sin(a); return v*c + cross(k,v)*s + k*dot(k,v)*(1.0-c); }
vec3 rotY(vec3 v, float a){ float c = cos(a), s = sin(a); return vec3(c*v.x + s*v.z, v.y, -s*v.x + c*v.z); }
float angBetween(vec3 a, vec3 b){ return 2.0*asin(clamp(length(a-b)*0.5, 0.0, 1.0)); } // precise for small angles
vec2 uvOf(vec3 n){ return vec2(atan(n.x, n.z)/(2.0*PI) + 0.5, 0.5 - asin(clamp(n.y,-1.,1.))/PI); }
float lum(vec3 c){ return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

// ---------------------------------------------------------------- atmosphere
float altitude(vec3 p){ float r = length(p); float s = p.y/r; return r - (1.0 - FL*s*s); }
// Chapman grazing-incidence function (Schüler's approximation), X = r/H
float chap(float X, float cosc){
  float c = sqrt(1.5707963*X);
  if (cosc >= 0.0) return c/((c-1.0)*cosc + 1.0);
  float s = sqrt(max(1.0 - cosc*cosc, 0.0));
  return 2.0*sqrt(1.5707963*X*s)*exp(min(X*(1.0 - s), 60.0)) - c/((c-1.0)*(-cosc) + 1.0);
}
float ozAbove(float h){ return clamp((OZC + OZW - h)/(2.0*OZW), 0.0, 1.0); }
// transmittance from altitude h along a direction whose cosine to local vertical is cosc
vec3 transCos(float r, float h, float cosc){
  float cR = chap(r/HR, cosc), cM = chap(r/HM, cosc);
  vec3 tau = BR*HR*exp(-h/HR)*cR + BME*HM*exp(-h/HM)*cM + BO*OZW*ozAbove(h)*min(cR, 40.0);
  return exp(-tau);
}
// diffuse skylight on a horizontal surface at altitude h: light scattered out of the solar beam,
// half of the Rayleigh part and ~85% of the forward-peaked Mie part continues downward
vec3 diffuseIrr(float r, float h, float sinApp, float mu){
  float cR = chap(r/HR, max(sinApp, 0.0)), cM = chap(r/HM, max(sinApp, 0.0));
  vec3 tR = BR*HR*exp(-h/HR)*cR; float tM = BMS*HM*exp(-h/HM)*cM;
  vec3 tA = BO*OZW*ozAbove(h)*min(cR, 40.0) + (BME - BMS)*HM*exp(-h/HM)*cM;
  vec3 ts = tR + tM;
  vec3 Ed = uEsun*max(sinApp, 0.0)*exp(-tA)*(1.0 - exp(-ts))*(0.5*tR + 0.85*tM)/ts*0.9;
  Ed += uEsun*0.0021*exp(min(mu, 0.0)*60.0)*vec3(0.62, 0.80, 1.0)*step(mu, 0.0); // twilight sky after sunset
  return Ed;
}
// spherical albedo of the atmosphere above altitude h: light the surface reflects that the sky sends back
// Atmospheric refraction for a ray grazing at tangent altitude h: total bending (rad).
// delta = (n0-1) sqrt(2 pi r / H) exp(-h/H), n0-1 = 2.93e-4 at sea level, H = 8 km -> 1.17 deg at the surface
float refrBend(float h){ return 2.93e-4*sqrt(2.0*PI*(1.0 + h)/HR)*exp(-h/HR); }
// optical depth of a full tangent chord at altitude h (Rayleigh + aerosol + ozone shell)
vec3 tauChord(float h){
  float r = 1.0 + h;
  float oz = 2.0*(sqrt(max(pow(1.0+OZC+OZW, 2.0) - r*r, 0.0)) - sqrt(max(pow(1.0+OZC-OZW, 2.0) - r*r, 0.0)));
  return BR*HR*exp(-h/HR)*2.0*sqrt(1.5708*r/HR) + BME*HM*exp(-h/HM)*2.0*sqrt(1.5708*r/HM) + BO*0.5*oz;
}
// limb-darkened photosphere radiance seen along direction d
vec3 sunL(vec3 d, float aa){
  float a = angBetween(d, uSun);
  if (a > uSunRad + aa) return vec3(0.0);
  float x = clamp(a/uSunRad, 0.0, 1.0), m = sqrt(1.0 - x*x);
  vec3 u = vec3(0.47, 0.56, 0.68);
  vec3 I = (1.0 - u*(1.0 - m))/(1.0 - u/3.0);
  float edge = aa > 0.0 ? clamp((uSunRad - a)/aa + 0.5, 0.0, 1.0) : 1.0;
  return uEsun/(PI*uSunRad*uSunRad)*I*edge;
}
// seasonal change of the surface (NASA Blue Marble NG monthly maps): snow cover, sea ice, vegetation
vec3 seasonD(vec2 uv, float m){
  vec2 t = vec2(mod(m, 4.0) + clamp(uv.x, 0.0005, 0.9995), floor(m/4.0) + clamp(uv.y, 0.001, 0.999))/vec2(4.0, 3.0);
  vec3 e = textureLod(tSeason, t, 0.0).rgb*2.0 - 1.0;
  return sign(e)*e*e;
}
vec3 sphAlb(float h){ vec3 t = BR*HR*exp(-h/HR); return 0.92*t*exp(-t) + 0.02*exp(-h/HM); }
float overlap(float r1, float r2, float d){            // fraction of disc r1 covered by disc r2
  if (d >= r1 + r2) return 0.0;
  if (d <= abs(r2 - r1)) return r2 >= r1 ? 1.0 : (r2*r2)/(r1*r1);
  float a = r1*r1*acos(clamp((d*d + r1*r1 - r2*r2)/(2.0*d*r1), -1., 1.))
          + r2*r2*acos(clamp((d*d + r2*r2 - r1*r1)/(2.0*d*r2), -1., 1.))
          - 0.5*sqrt(max((-d+r1+r2)*(d+r1-r2)*(d-r1+r2)*(d+r1+r2), 0.0));
  return a/(PI*r1*r1);
}
// visible fraction of the solar disc from a point whose horizon dips by 'dip' (rad),
// including refraction (Saemundsson). Returns apparent sine of elevation in 'sinApp'.
float sunDisc(float sinGeo, float dip, out float sinApp){
  float h = degrees(asin(clamp(sinGeo, -1., 1.)));
  float hh = max(h + degrees(dip), -1.5);
  float R = 1.02/tan(radians(hh + 10.3/(hh + 5.11)))/60.0;
  float ha = h + R;
  sinApp = sin(radians(ha));
  float x = clamp((ha + degrees(dip))/degrees(uSunRad), -1.0, 1.0);
  return 1.0 - (acos(x) - x*sqrt(1.0 - x*x))/PI;
}
float solarEclipse(vec3 p){
  vec3 m = uMoon - p; float dm = length(m);
  return 1.0 - overlap(uSunRad, asin(RMOON/dm), angBetween(m/dm, uSun));
}

// ---------------------------------------------------------------- generated clouds
float sq(float x){ return x*x; }                            // never pow(x, 2.0): pow of a negative base is undefined (NaN on phone GPUs)
float wind(float latDeg){
  float w = -0.0045*exp(-sq(latDeg/16.0)) + 0.013*exp(-sq((abs(latDeg)-47.0)/15.0));
  return w/max(cos(radians(latDeg)), 0.25);
}
// --- gradient noise (Gustavson/McEwan simplex, mod-289 permutation: smooth, no grid, precision-safe)
vec3 m289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 m289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
vec4 perm(vec4 x){ return m289(((x*34.0) + 10.0)*x); }
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy)), x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz), l = 1.0 - g, i1 = min(g.xyz, l.zxy), i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx, x2 = x0 - i2 + C.yyy, x3 = x0 - D.yyy;
  i = m289(i);
  vec4 p = perm(perm(perm(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  vec3 ns = 0.142857142857*D.wyz - D.xzx;
  vec4 j = p - 49.0*floor(p*ns.z*ns.z), x_ = floor(j*ns.z), y_ = floor(j - 7.0*x_);
  vec4 x = x_*ns.x + ns.yyyy, y = y_*ns.x + ns.yyyy, h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy), b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0, s1 = floor(b1)*2.0 + 1.0, sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy, a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x), p1 = vec3(a0.zw, h.y), p2 = vec3(a1.xy, h.z), p3 = vec3(a1.zw, h.w);
  vec4 nrm = 1.79284291400159 - 0.85373472095314*vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3));
  p0 *= nrm.x; p1 *= nrm.y; p2 *= nrm.z; p3 *= nrm.w;
  vec4 m = max(0.5 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m*m;
  return 105.0*dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}
// fBm of simplex noise in [0,1], fractional octave count fades detail in by zoom (no popping)
float sfbm(vec3 p, float oct, float gain){
  float a = 0.5, s = 0.0, t = 0.0;
  for (int i = 0; i < 10; i++){
    float w = clamp(oct - float(i), 0.0, 1.0); if (w <= 0.0) break;
    s += a*w*snoise(p); t += a; p = p*2.02 + vec3(13.1, 7.3, 3.7); a *= gain;
  }
  return 0.5 + 0.5*s/max(t, 1e-3)*1.6;
}
// billowy (cauliflower) detail: 1 - |noise|
float billow(vec3 p, float oct){
  float a = 0.5, s = 0.0, t = 0.0;
  for (int i = 0; i < 7; i++){
    float w = clamp(oct - float(i), 0.0, 1.0); if (w <= 0.0) break;
    s += a*w*(1.0 - abs(snoise(p))); t += a*w; p = p*2.07 + vec3(4.7, 1.3, 9.1); a *= 0.55;
  }
  return t > 0.0 ? s/t : 0.5;
}
// cellular F1 (2x2x2 nearest cells, jittered) for marine stratocumulus cells
vec3 gCell;                                                // (set by worley: from here to the nearest cell's middle)
float worley(vec3 P){
  vec3 Pi = floor(P), Pf = fract(P), o = step(0.5, Pf) - 1.0; float d = 9.0; gCell = vec3(0.0);
  for (int k = 0; k < 8; k++){
    vec3 c = o + vec3(float(k & 1), float((k >> 1) & 1), float((k >> 2) & 1));
    vec3 cc = m289(Pi + c);
    vec4 h = perm(perm(perm(vec4(cc.x)) + cc.y) + cc.z + vec4(0.0, 17.0, 41.0, 0.0));
    vec3 jit = fract(h.xyz*(1.0/41.0))*0.8 + 0.1;
    vec3 r = c + jit - Pf; float dd = dot(r, r);
    if (dd < d){ d = dd; gCell = r; }
  }
  return sqrt(d);
}
// bright but shallow: marine stratocumulus decks over cold water just west of the subtropical continents
// (off California, Peru, Namibia). Everywhere else, brighter cloud is taken to be deeper cloud.
float lowDeck(vec3 p){
  float lat = degrees(asin(clamp(p.y,-1.,1.)));
  float landE = 1.0 - min(textureLod(tWater, uvOf(rotY(p, 0.12)), 5.0).r, textureLod(tWater, uvOf(rotY(p, 0.25)), 5.0).r);
  return exp(-sq((abs(lat) - 22.0)/10.0))*textureLod(tWater, uvOf(p), 6.0).r*landE;
}
float cmap(vec2 uv, float lod){ return uLive > 0.5 ? textureLod(tLive, uv, lod).r : textureLod(tCloud, uv, lod).r; }
const float CBASE = 2.0*KM, CTOP = 11.0*KM;                // cloud layer: lowest tops, highest tops
// where a place's cloud is read from in the map: the live map carried by the winds since it was made,
// or the stored map wandering slowly (a bounded warp that changes over ~2 days)
vec3 cwarp(vec3 p, float lat){
  if (uLive > 0.5) return rotY(p, -wind(lat)*min(uLiveAge, 36.0));
  vec3 t = p*2.6 + uOff*1.8;
  return normalize(p + 0.03*vec3(snoise(t), snoise(t + 7.1), snoise(t + 13.7)));
}
float cfrac(vec3 pw, float lod, float lat){                // cloud fraction 0..1 from the map
  float c = cmap(uvOf(pw), lod);
  c *= 0.45 + 0.55*smoothstep(-74.0, -64.0, lat);           // the map's Antarctic ice brightness is not cloud
  return clamp((c - 0.06)/0.94, 0.0, 1.0);
}
// optical thickness that goes with a cloud fraction
float tauOfC(float c){ float R = clamp(pow(c, 1.15)*mix(0.5, 0.9, smoothstep(0.2, 0.85, c)), 0.0, 0.93); return R/(0.075*(1.0 - R)); }
// how high the cloud reaches: set so the map gives the real spread of cloud-top heights
// (about a fifth of the globe under tops above 6 km, a tenth above 9 km; most cloud low)
float topOfC(float c, float deck){ return CBASE + (CTOP - CBASE)*smoothstep(0.12, 0.72, c)*(1.0 - 0.85*deck); }
// Returns cloud OPTICAL THICKNESS tau.
// Base: a real global cloud field (NASA Blue Marble cloud layer, from satellite). It is not today's weather,
// but it has real weather's structure: cyclones, fronts, cloud streets, trade cumulus, stratocumulus decks.
// Below the map's ~10 km resolution it resolves into puffs and streaks.
float gPuff; vec3 gPuffUp;                                 // (set by cloudsW: how much of this spot is a cumulus puff, and its uphill direction x steepness)
float cloudsW(vec3 p, vec3 pw, float oct){
  gPuff = 0.0; gPuffUp = vec3(0.0);
  float lat = degrees(asin(clamp(p.y, -1., 1.)));
  float fp = 0.5/(7.0*exp2(oct));                          // pixel footprint (rad) implied by oct
  float lod = log2(max(fp*652.0, 1.0));
  float c = cfrac(pw, lod, lat);
  // The map value is the cloud FRACTION in each ~10 km pixel. Zoomed past that, it resolves into separate
  // puffs covering that fraction (fair-weather cumulus), while solid decks stay solid.
  float Rmax = mix(0.5, 0.9, smoothstep(0.2, 0.85, c));     // scattered cumulus are thinner than decks
  float cov = c;
  // individual cumulus ~4 km apart, sized so their area matches the map's fraction, grouped into clusters,
  // with lumpy (cauliflower) edges; only once a cell spans a few pixels (otherwise the fraction IS the look)
  const float CU = 650.0*2.5;                                // cells per radian (~4 km)
  float pxPerCell = (1.0/CU)/fp;
  // cumulus fields are mostly a tropical/subtropical-ocean look; mid-latitude cloud is mostly layered (fronts)
  float cuType = mix(0.25, 1.0, exp(-sq(lat/30.0)));
  float aC = smoothstep(2.0, 5.0, pxPerCell)*(1.0 - smoothstep(0.88, 0.98, c))*cuType;
  // layered cloud: soft, wind-streaked texture instead of puffs
  float sOct = clamp(log2((1.0/650.0)/(fp*3.0)) + 1.0, 0.0, 5.0);
  if (sOct > 0.0){
    vec3 qs = pw*650.0*vec3(1.0, 2.2, 1.0);
    float sd = sfbm(qs + 0.4*vec3(snoise(qs*0.3), snoise(qs*0.3 + 5.0), 0.0), sOct, 0.5);
    cov = clamp(c + (sd - 0.5)*0.9*(1.0 - abs(2.0*c - 1.0))*smoothstep(0.0, 1.0, sOct), 0.0, 1.0);
  }
  if (aC > 0.0){
    vec3 qd = pw*CU;
    float cluster = sfbm(qd*0.18 + 5.0, 3.0, 0.5);
    float fr = clamp(c*(0.35 + 1.3*cluster), 0.0, 1.0);
    float r = sqrt(fr/3.1416)*1.2;
    float lOct = clamp(log2((0.25/CU)/(fp*2.0)) + 2.0, 0.0, 4.0);
    float lump = lOct > 0.0 ? (sfbm(qd*4.0, lOct, 0.55) - 0.5)*0.22 : 0.0;
    float F1 = worley(qd + 0.25*vec3(snoise(qd*0.5), snoise(qd*0.5 + 4.0), 0.0));
    float soft = max(0.03, 1.5/pxPerCell);
    float puffs = 1.0 - smoothstep(r - soft, r + soft, F1 + lump);
    // A cumulus is a heap, not a disc: deep and bright in the middle, thin and greyer toward its rim, with the
    // lumps of its turrets. (Its average stays what the map says, so from afar nothing changes.)
    float dome = sqrt(clamp(1.0 - (F1 + lump)/max(r, 0.05), 0.0, 1.0)), near = smoothstep(4.0, 10.0, pxPerCell);
    puffs *= mix(1.0, 0.5 + 0.94*dome, near);
    gPuff = aC*near*step(0.5, puffs + 0.5*step(F1 + lump, r));
    // the heap's slope: about as tall as it is wide across (a puff r cells wide rises ~0.6 r cells)
    gPuffUp = gCell/max(F1, 0.02)*(0.6*0.5/max(dome, 0.25));
    cov = mix(cov, puffs, aC);
  }
  float R = clamp(pow(max(cov, 0.0), 1.15)*Rmax, 0.0, 0.93);   // reflectance of the cloudy part
  return R/(0.075*(1.0 - R));                               // invert two-stream: R -> tau
}
float clouds(vec3 p, float oct){ return cloudsW(p, cwarp(p, degrees(asin(clamp(p.y, -1., 1.)))), oct); }
// fraction of light a cloud of optical thickness tau reflects (two-stream, conservative scattering, g = 0.85)
float cloudR(float tau){ return 0.075*tau/(1.0 + 0.075*tau); }

// ---------------------------------------------------------------- terrain: real heights, TRUE SCALE (no vertical exaggeration)
// Elevation map: NASA Blue Marble topography, value 0..1 = 0..6400 m. Checked against 23 known elevations
// (Denver, Lhasa, La Paz, the South Pole...): 25.0 m per count, 66 m rms. Everest is 0.14% of the Earth's radius.
// Relief finer than the map's ~5 km is ridged fractal noise whose strength at each place is the MEASURED relief
// the map cannot show there (rms of the 1.85 km data about the map: Alps ~250 m, Kansas ~10 m) - rugged where
// the Earth is rugged, flat where it is flat, never taller than the data says.
const float HS = 6400.0/6378137.0, RS = 600.0/6378137.0;   // map values -> Earth radii
const float HTOP = 7.6*KM;                                 // nothing stands higher than this
const float TF = 1300.0;                                   // first detail octave: ~5 km cells
#define TEXR uTexR                                         // elevation texels per radian
float altE(vec3 p){ return length(vec3(p.x, p.y*EY, p.z)) - 1.0; }   // height above the ellipsoid (exactly 0 on it)
vec3 geoN(vec3 p){ return normalize(vec3(p.x, p.y*EY*EY, p.z)); }
float terrDetail(vec3 d, float oct){                       // zero mean; rms 1 with the first octave, 1.1 with all three
  float a = 1.0, s = 0.0; vec3 q = d*TF;
  for (int i = 0; i < 3; i++){
    float w = clamp(oct - float(i), 0.0, 1.0); if (w <= 0.0) break;
    float nz = snoise(q), r = 1.0 - sqrt(nz*nz + 0.01);    // ridges, with rounded crests
    s += a*w*(r*r - 0.53)/0.27;                            // mean and spread of r*r for this noise (measured)
    q = q*2.03 + vec3(7.3, 1.1, 4.7); a *= 0.45;
  }
  return s;
}
float terrH(vec3 d, float lod, float oct){                 // ground height above the ellipsoid, Earth radii
  vec2 uv = uvOf(d);
  float h = textureLod(tTopo, uv, lod).r*HS;
  if (oct > 0.0 && h > 0.0){
    float rg = max(textureLod(tRug, uv, 0.0).r*RS - 1.6e-6, 0.0);   // minus the map's own ~10 m rounding noise
    if (rg > 0.0) h += rg*min(1.0, h/(2.5*rg))*terrDetail(d, oct);
  }
  return h;
}
// First point where the ray goes under the ground between ta and tb (-1: none). 'closed': the ray is known to
// be under the ground at tb. A cheap pass on the map alone finds where the ray comes within reach of the terrain;
// from there it walks forward by a fraction of its clearance (safe for slopes up to ~50 deg) with the fine relief.
float terrMarch(vec3 ro, vec3 rd, float ta, float tb, float pix, float oct, bool closed, float M){   // M: reach of the fine relief here
  float n1 = clamp(ceil((tb - ta)/(2.0*ta*pix)), 6.0, uQ > 0.5 ? 24.0 : 14.0);       // no finer than ~2 pixels
  float dt = (tb - ta)/n1, lod = max(log2(dt*TEXR) - 1.0, log2(max(ta*pix*TEXR, 1.0)));
  float tz = -1.0, te = tb, t = ta;
  for (int i = 0; i <= 24; i++){
    if (float(i) > n1) break;
    vec3 q = ro + rd*t;
    float c = altE(q) - textureLod(tTopo, uvOf(geoN(q)), lod).r*HS;
    if (tz < 0.0){ if (c < M) tz = max(t - dt, ta); }
    if (tz >= 0.0 && c < -M){ te = t; closed = true; break; }
    t += dt;
  }
  if (tz < 0.0) return -1.0;
  float a = tz, c = 1.0; t = tz;
  int n2 = uQ > 0.5 ? 18 : 10;
  for (int i = 0; i < 18; i++){
    if (i >= n2) break;
    vec3 q = ro + rd*t;
    c = altE(q) - terrH(geoN(q), log2(max(t*pix*TEXR, 1.0)), min(oct, 1.5));
    if (c < 0.0) break;
    a = t; t += max(0.55*c, 0.75*t*pix);
    if (t >= te){ t = te; c = closed ? -1.0 : 1.0; break; }
  }
  if (c >= 0.0) return c < (uQ > 0.5 ? 2.0 : 6.0)*t*pix ? t : -1.0;   // out of steps while skimming the ground: call it touched
  float b = t;
  for (int k = 0; k < 4; k++){
    float m = 0.5*(a + b); vec3 q = ro + rd*m;
    if (altE(q) - terrH(geoN(q), log2(max(m*pix*TEXR, 1.0)), oct) < 0.0) b = m; else a = m;
  }
  return 0.5*(a + b);
}
// How much of the Sun a ground point sees past the terrain toward it (long mountain shadows at low sun).
// The point and the terrain it is tested against are taken from the same smoothed model of the ground,
// so a slope never shadows itself by accident.
float terrShadow(vec3 p, vec3 n, float sinE, float pixLod){
  float lodS = max(pixLod, 1.0);
  vec3 p0 = p + n*(terrH(n, lodS, 0.0) - altE(p) + 40.0/6378137.0);   // cast shadows come from the mapped relief only
  float L = min(6.0*KM/max(sinE, 0.06), 90.0*KM), sh = 1.0;
  for (int k = 1; k <= 8; k++){
    float t = L*float(k*k)/64.0;
    vec3 q = p0 + uSun*t;
    float c = altE(q) - terrH(geoN(q), lodS, 0.0);
    sh = min(sh, smoothstep(-0.5, 1.0, c/max(0.03*t, 40.0/6378137.0)));
  }
  return sh;
}

// ---------------------------------------------------------------- human eye glare (CIE 2002, age 25)
float glare(float thetaRad, float minRad){        // L_veil / E_glare, theta in degrees, p = 0.5, A = 25
  float t = max(degrees(thetaRad), degrees(minRad));
  return 10.0/(t*t*t) + 5.13/(t*t) + 0.0513/t + 0.00125;
}

// ---------------------------------------------------------------- the Moon's relief
// Height of the lunar surface above its mean sphere (in Earth radii), from NASA's laser altimetry (LOLA, 16 points
// per degree): a smooth large-scale shape (tMoonB) plus fine detail stored with more precision where it is small.
float erfA(float x){ float x2 = x*x; return sign(x)*sqrt(max(1.0 - exp(-x2*(1.2732395 + 0.147*x2)/(1.0 + 0.147*x2)), 0.0)); }
// A sheet of glow, Gaussian across (1 at its middle): how much of it a straight stretch running from x0 to x1 (in
// widths from the middle) passes on average, and how far along the stretch (0..1) that glow is centred.
vec2 sheet(float x0, float x1){
  float dx = x1 - x0, g0 = exp(-x0*x0), g1 = exp(-x1*x1);
  if (abs(dx) < 0.02) return vec2(0.5*(g0 + g1), 0.5);
  float de = erfA(x1) - erfA(x0);
  if (abs(de) < 1.0e-6) return vec2(0.0, 0.5);
  return vec2(0.8862269*de/dx, clamp((0.5*(g0 - g1)/(0.8862269*de) - x0)/dx, 0.0, 1.0));
}
float aurP(float hkm){ return hkm < 107.0 ? clamp((hkm - 97.0)/10.0, 0.0, 1.0) : exp(-(hkm - 107.0)/22.0); }   // a curtain's glow with height
const float MTOP = 11000.0/6378137.0, MBOT = 9500.0/6378137.0;
vec2 moonUV(vec3 nm){ return vec2(atan(dot(nm,uMX), dot(nm,uMZ))/(2.0*PI) + 0.5, 0.5 - asin(clamp(dot(nm,uMY),-1.,1.))/PI); }
float moonH(vec2 uv, float lod){
  float e = textureLod(tMoonH, uv, lod).r*2.0 - 1.0;
  return (textureLod(tMoonB, uv, 0.0).r*20500.0 - 9500.0 + e*abs(e)*8000.0)/6378137.0;
}
// How much of the Sun a spot on the Moon sees past the terrain that lies toward it (1 = all of it).
// P0: the spot, relative to the Moon's centre. The ray to the Sun is followed until it clears the highest peaks.
float moonShadow(vec3 P0, float lod, int n){
  float b = dot(P0, uSun), c = dot(P0, P0) - (RMOON + MTOP)*(RMOON + MTOP), D = b*b - c;
  if (D <= 0.0) return 1.0;
  float lmax = -b + sqrt(D), vis = 1.0;
  for (int k = 1; k <= 12; k++){
    if (k > n) break;
    float f = float(k)/float(n), l = lmax*f*f;
    vec3 p = P0 + uSun*l; float r = length(p);
    float w = l*0.0047 + 1.2e-5;                                   // the Sun's half-width at that distance (and the map's own 80 m steps): a soft edge
    vis = min(vis, smoothstep(-w, w, r - RMOON - moonH(moonUV(p/r), lod)));
    if (vis <= 0.0) break;
  }
  return vis;
}
// Craters smaller than the elevation map can show (it has one point every 1.9 km). These are not the Moon's actual
// small craters - nobody ships those in a few megabytes - but they have the real Moon's crowding, size mix, depths
// and raised rims, and without them the ground seen from low orbit would be smooth, which it is not.
// Returns the slope they add (a vector along the ground: rise over run) and how much of the Sun they hide.
vec4 hash43(vec3 p){
  vec4 q = fract(vec4(p.xyzx)*vec4(0.1031, 0.1030, 0.0973, 0.1099)); q += dot(q, q.wzxy + 33.33);
  return fract((q.xxyz + q.yzzw)*q.zywx);
}
void moonCraters(vec3 nm, float fp, float crowd, out vec3 grad, out float shade){
  grad = vec3(0.0); shade = 1.0;
  float se = dot(nm, uSun); vec3 sT = uSun - nm*se; float ch = max(length(sT), 1e-4); sT /= ch;
  float tanE = se/ch;
  for (int k = 0; k < 7; k++){
    float cell = (8.0/1737.4)*exp2(-float(k));                       // 8 km, 4 km, 2 km ... (in Moon radii)
    float vis = clamp(cell/(4.0*fp) - 0.5, 0.0, 1.0);                // gone once its craters are a pixel or two across
    if (vis <= 0.0) break;
    vec3 P = nm/cell, b = floor(P - 0.5);
    for (int i = 0; i < 8; i++){
      vec3 id = b + vec3(float(i & 1), float((i >> 1) & 1), float((i >> 2) & 1));
      vec4 r = hash43(id + float(k)*17.0);
      if (r.w > crowd) continue;
      vec3 c = (id + 0.25 + 0.5*r.xyz)*cell; float cl = length(c);
      if (abs(cl - 1.0) > 0.5*cell) continue;                        // (cells that do not straddle the surface)
      vec3 dv = nm - c/cl; dv -= nm*dot(dv, nm);                     // from the crater's centre, along the ground
      vec4 r2 = hash43(id*1.37 + 5.1 + float(k)*3.0);
      float Rc = cell*(0.09 + 0.33*r2.x*r2.x*r2.x), dl = length(dv), rho = dl/Rc;   // radius: many small, few large
      if (rho > 2.5) continue;
      float fresh = 0.12 + 0.88*r2.y*r2.y*r2.y;                      // most are worn down: shallower, softer rims
      float d = 0.36*Rc*fresh, hr = 0.07*Rc*fresh;                   // a fresh one: depth 0.18 x diameter, rim 0.035
      vec3 u = dv/max(dl, 1e-9);
      grad += u*(vis*(rho < 1.0 ? 2.0*(d + hr)*rho/Rc : -3.0*hr/(Rc*rho*rho*rho*rho)));
      if (tanE > 0.0){                                               // the rim's shadow: inside the bowl, and behind it
        float a = dot(dv, sT)/Rc, soft = 0.03 + 1.5*fp/Rc, sdw = -1.0;
        if (rho < 1.0){ float L = -a + sqrt(a*a + 1.0 - rho*rho); sdw = (d + hr)*(1.0 - rho*rho)/(L*Rc) - tanE; }
        else { float D = a*a - (rho*rho - 1.0);
          if (a < 0.0 && D > 0.0){ float L = -a - sqrt(D); sdw = hr*(1.0 - 1.0/(rho*rho*rho))/(max(L, 1e-3)*Rc) - tanE; } }
        shade *= 1.0 - vis*smoothstep(-soft*max(tanE, 0.05), soft*max(tanE, 0.05), sdw);
      }
    }
  }
}
// The Moon's surface darkens with phase angle much faster than its geometry alone explains (the full Moon is about
// 11 times brighter than the half Moon, not 2.7): the measured phase law divided by the Lommel-Seeliger one.
float moonPhase(float cosA){
  float al = clamp(acos(clamp(cosA, -1.0, 1.0)), 2.0e-3, 2.618), ad = degrees(al);
  float real = pow(10.0, -0.4*(0.026*ad + 4.0e-9*ad*ad*ad*ad));
  float ls = 1.0 - sin(0.5*al)*tan(0.5*al)*log(1.0/tan(0.25*al));
  return real/max(ls, 1.0e-3);
}

void main(){
  vec3 Lcity = vec3(0.0);                                   // street lighting reaching the eye from this spot (kept apart: see the rods, at the end)
  vec2 fc = gl_FragCoord.xy - 0.5*uRes;
  vec3 rd = normalize(uVR*fc.x*uPix + uVU*fc.y*uPix - uVB);
  vec3 ro = uCam;

  // ---- WGS84 ellipsoid intersection (scaled space) ----
  vec3 roS = vec3(ro.x, ro.y*EY, ro.z), rdS = vec3(rd.x, rd.y*EY, rd.z);
  float qa = dot(rdS,rdS), qb = dot(roS,rdS);
  float D = qb*qb - qa*(dot(roS,roS) - 1.0);
  float tg = D > 0.0 ? (-qb - sqrt(D))/qa : -1.0;
  bool hit = tg > 0.0;
  float tca = max(-dot(ro, rd), 0.0);
  vec3 pmin = ro + rd*tca;
  float dl = length(vec3(pmin.x, pmin.y*EY, pmin.z)) - 1.0;
  float cov = hit ? clamp(0.5 - dl/(max(tca,1e-4)*uPix), 0.0, 1.0) : 0.0;
  vec3 p = hit ? ro + rd*tg : pmin/length(vec3(pmin.x, pmin.y*EY, pmin.z));
  vec3 n = normalize(vec3(p.x, p.y*EY*EY, p.z));             // geodetic normal
  float dist = hit ? tg : tca;
  float fp = max(dist, 1e-5)*uPix;                           // pixel footprint (rad of arc)

  // ---- terrain in true relief: marched only where its height would shift things by about a pixel ----
  bool nearT = false;
  {
    float cT = dot(roS,roS) - (1.0 + HTOP)*(1.0 + HTOP), dT = qb*qb - qa*cT;
    if (dT > 0.0){
      float ta = max((-qb - sqrt(dT))/qa, 0.0), tb = hit ? tg : (-qb + sqrt(dT))/qa;
      float mv = hit ? dot(n, -rd) : 0.0;
      if (tb > ta && 4.0*KM*sqrt(max(1.0 - mv*mv, 0.0)) > 0.75*ta*uPix){
        vec3 pa = ro + rd*ta, pm = ro + rd*0.5*(ta + tb);
        float land = textureLod(tTopo, uvOf(n), 6.0).r + textureLod(tTopo, uvOf(geoN(pa)), 6.0).r + textureLod(tTopo, uvOf(geoN(pm)), 5.0).r;
        if (land > 0.002){
          nearT = true;
          float octM = clamp(log2((1.0/TF)/(ta*uPix*4.0)) + 1.0, 0.0, 3.0);
          float reach = (octM > 0.0 ? 3.3*max(textureLod(tRug, uvOf(n), 3.0).r, textureLod(tRug, uvOf(geoN(pm)), 3.0).r)*RS : 0.0) + 40.0/6378137.0;
          float tT = terrMarch(ro, rd, ta, tb, uPix, octM, hit, reach);
          if (tT > 0.0){ hit = true; tg = tT; p = ro + rd*tT; cov = 1.0; n = geoN(p); dist = tT; fp = max(dist, 1e-5)*uPix; }
        }
      }
    }
  }

  // ---- textures (seam-safe gradients) ----
  vec2 uv = uvOf(n);
  vec2 uvB = vec2(fract(uv.x + 0.5) - 0.5, uv.y);
  vec2 dx = dFdx(uv), dy = dFdy(uv), dxB = dFdx(uvB), dyB = dFdy(uvB);
  if (abs(dxB.x) + abs(dyB.x) < abs(dx.x) + abs(dy.x)) { dx.x = dxB.x; dy.x = dyB.x; }
  vec3 Lg = vec3(0.0); float Lw = 0.0;                        // ground: light toward the eye; what a white surface would send
  if (cov > 0.0){                                             // (rays that miss the globe skip all of this)
  float water = textureGrad(tWater, uv, dx, dy).r;
  vec3 tex = pow(textureGrad(tDay, uv, dx, dy).rgb, vec3(2.2));
  tex = max(tex + mix(seasonD(uv, uMonth.x), seasonD(uv, uMonth.y), uMonth.z), 0.0);
  float ice = water*smoothstep(0.12, 0.3, lum(tex));          // sea ice: bright, matte, no glint
  water *= 1.0 - ice;
  // The map is a display image, not reflectance: calibrate. Land is desaturated and scaled toward measured
  // reflectances (forest ~0.03/0.05/0.02, Sahara ~0.46/0.37/0.27); snow and ice set to ~0.95.
  float tl = lum(tex);
  vec3 albedo = mix(vec3(tl), tex, mix(0.75, 1.1, smoothstep(0.04, 0.3, tl)))*mix(1.0, 0.7, smoothstep(0.1, 0.5, tl));
  float snowy = smoothstep(0.86, 0.95, min(tex.r, min(tex.g, tex.b))/max(max(tex.r, tex.g), tex.b)*1.0)*smoothstep(0.35, 0.55, tl);
  albedo = mix(albedo, vec3(0.90, 0.94, 0.96)*clamp(tl/0.6, 0.6, 1.0), snowy);
  albedo = mix(albedo, tex, water);                         // ocean colours were already set from optics
  albedo = mix(albedo, vec3(0.80, 0.84, 0.88)*clamp(lum(tex)/0.55, 0.5, 1.05), ice);
  float lightsV = textureGrad(tLights, uv, dx, dy).r;
  float lat = asin(clamp(n.y,-1.,1.)), lon = atan(n.x, n.z);
  vec3 east = vec3(cos(lon), 0.0, -sin(lon));
  vec3 north = vec3(-sin(lat)*sin(lon), cos(lat), -sin(lat)*cos(lon));
  // surface normal from the real slope of the ground (rise over run, both in Earth radii: true scale)
  float lodT = log2(max(fp*TEXR, 1.0));
  float octT = clamp(log2((1.0/TF)/(fp*4.0)) + 1.0, 0.0, 3.0);  // an octave joins in once its cells span ~4 pixels
  float eT = 1.2*max(fp, 1.0/TEXR);
  float hg = terrH(n, lodT, octT);                            // ground height here
  vec2 sl = vec2(terrH(normalize(n + east*eT), lodT, octT) - hg, terrH(normalize(n + north*eT), lodT, octT) - hg)/eT;
  sl *= smoothstep(0.0012, 0.005, length(sl));                // slopes within the map's 25 m rounding count as flat
  vec3 nb = normalize(n - sl.x*east - sl.y*north);
  float detail = 1.0 - smoothstep(0.0002, 0.0009, fp);
  if (detail > 0.0){                                          // fine colour variation below the image's resolution
    float f0 = 1200.0, oct = clamp(log2(0.5/(fp*f0)), 0.0, 7.0);
    albedo *= 1.0 + detail*(sfbm(n*f0, oct, 0.55) - 0.5)*mix(0.45, 0.08, water);
  }

  // ---- direct sunlight at the ground: refraction, disc, extinction, eclipse, cloud shadow ----
  float mu = dot(n, uSun), sinApp;
  float vis = sunDisc(mu, 0.0, sinApp);
  vec3  Tg  = transCos(1.0 + hg, hg, max(sinApp, 0.0));     // less air above high ground
  float tsh = (fp < 2.0e-4 && mu > -0.02 && mu < 0.5 && water < 0.5) ? terrShadow(p, n, max(sinApp, 0.0), lodT) : 1.0;
  float ecl = solarEclipse(p);
  float octC = clamp(log2(0.5/(fp*7.0)), 1.0, 11.0);
  // cloud shadows, cast along the sun from the cloud's real height: low cloud from ~3 km, and deep cloud
  // from its upper part too, so tall systems throw long shadows when the sun is low
  vec3 dS = (uSun - n*mu)/max(mu, 0.06);
  vec3 ps = normalize(p + dS*3.0*KM), pwS = cwarp(ps, degrees(lat));
  float tauS = cloudsW(ps, pwS, max(octC - 2.0, 1.0));
  if (mu < 0.6){                                              // (with the sun high the two fall in the same place)
    vec3 p7 = normalize(p + dS*7.5*KM);
    float c7 = cfrac(normalize(p7 + (pwS - ps)), max(log2(max(fp*652.0, 1.0)), 1.0), degrees(lat));
    tauS = max(tauS, tauOfC(c7)*smoothstep(7.0*KM, 8.5*KM, topOfC(c7, 0.0)));
  }
  float shadow = 1.0 - cloudR(tauS/max(mu, 0.25))*step(-0.05, mu);
  if (uNoCloud > 0.5 && uNoCloud < 1.5) shadow = 1.0;
  vec3 Edir = uEsun*Tg*vis*ecl*shadow*tsh;
  float cosI = max(dot(nb, uSun) + (sinApp - mu), 0.0);
  vec3 Esky = diffuseIrr(1.0 + hg, hg, sinApp, mu)*ecl*(0.55 + 0.45*shadow);
  // in rugged country a shaded slope is also lit by the sunlit slopes around it (why shadows on snow are not black)
  if (water < 0.98 && sinApp > 0.0) Esky += 0.25*clamp(textureLod(tRug, uv, 0.0).r*600.0/150.0, 0.0, 1.0)*(1.0 - water)*albedo*uEsun*Tg*vis*ecl*shadow*sinApp;
  vec3 mdir = normalize(uMoon - p); float mmu = dot(n, mdir);
  vec3 Emoon = uEmoon*max(mmu, 0.0)*transCos(1.0, 0.0, max(mmu, 0.02));
  Lg = albedo/PI*(Edir*cosI + Esky + Emoon)/(1.0 - sphAlb(hg)*albedo);
  Lw = lum(Edir*max(sinApp, 0.0) + Esky + Emoon)/PI;
  // City lights (cd/m²). Their colour: orange sodium lamps and the white LEDs replacing them, about half and half
  // by now - a warm yellow. Astronauts see these colours by eye; photographs only make them stronger.
  Lcity = vec3(1.14, 0.775, 0.376)*0.5*pow(lightsV, 2.2);
  Lg += Lcity;
  // ocean: Cox-Munk sun glint (wind 7 m/s) + Fresnel sky reflection
  vec3 v = -rd, hv = normalize(uSun + v);
  float cb = max(dot(n, hv), 1e-3), wind = 7.0;
  // the sea is not equally rough everywhere: calm patches and windy ones, tens to hundreds of km across, make the
  // glint patchy - mirror-bright where it is calm at its centre, dark where it is calm off to the side
  if (water > 0.02 && cb > 0.86) wind = 7.0*exp(0.55*snoise(p*46.0 + uOff*3.0) + 0.3*snoise(p*170.0 - uOff*5.0));
  float sig2 = 0.003 + 0.00512*wind;
  float tan2 = (1.0 - cb*cb)/(cb*cb);
  float F = 0.02 + 0.98*pow(1.0 - clamp(dot(hv, v), 0.0, 1.0), 5.0);
  float muv = max(dot(n, v), 0.03);
  Lg += water*Edir*F*exp(-tan2/sig2)/(PI*sig2)/(4.0*muv*cb*cb*cb*cb)*step(0.0, mu);
  Lg += water*(0.02 + 0.98*pow(max(1.0 - muv, 0.0), 5.0))*Esky/PI;
  vec3 hm = normalize(mdir + v); float cbm = max(dot(n, hm), 1e-3), tan2m = (1.0 - cbm*cbm)/(cbm*cbm);
  float Fm = 0.02 + 0.98*pow(1.0 - clamp(dot(hm, v), 0.0, 1.0), 5.0);
  Lg += water*uEmoon*transCos(1.0, 0.0, max(mmu, 0.02))*Fm*exp(-tan2m/sig2)/(PI*sig2)/(4.0*muv*cbm*cbm*cbm*cbm)*step(0.0, mmu);
  }

  // ---- clouds, with real thickness ----
  // Cloud tops form a height field (thin broken cloud ~2 km, deep systems to ~11 km). The ray is marched against it,
  // so tall cloud stands above low cloud, hides what is behind it, shows its flanks, and mountains poke through.
  float cloudA = 0.0, LwC = 0.0; vec3 Lc = vec3(0.0);
  float cTq = dot(roS,roS) - (1.0 + CTOP)*(1.0 + CTOP), cD = qb*qb - qa*cTq;
  if (cD > 0.0 && (uNoCloud < 0.5 || uNoCloud > 1.5)){
    float t0 = max((-qb - sqrt(cD))/qa, 0.0), t1 = hit ? tg : (-qb + sqrt(cD))/qa;
    if (t1 > t0){
      vec3 nref = normalize(ro + rd*mix(t0, t1, 0.6)); float latR = degrees(asin(clamp(nref.y, -1., 1.)));
      vec3 W = cwarp(nref, latR) - nref;                       // one shift for the whole ray (it varies slowly)
      float deck = abs(abs(latR) - 22.0) < 18.0 ? lowDeck(nref) : 0.0;

        float hN = topOfC(cfrac(normalize(pwc + nC*eA), lodc, latR), deck) - topOfC(cfrac(normalize(pwc - nC*eA), lodc, latR), deck);

            float top = topOfC(cfrac(normalize(normalize(q) + W), max(lodc, log2(max(sK*0.3*652.0, 1.0))), latR), deck);

  // ---- space behind: Milky Way, background starlight, Sun disc, Moon ----
  vec3 G = uW2G*rd;

  vec3 Lbg = vec3(1.0, 0.96, 0.88)*(7e-5 + 1.0e-3*pow(mw, 1.3));
  float aS = angBetween(rd, uSun);
  // The Sun's corona, thinning out into the zodiacal light (sunlight on the dust between the planets). It is always
  // there, a millionth as bright as the Sun's face at its edge, and is seen when the Sun itself is hidden - as the
  // Apollo crews saw it rise ahead of the Sun from behind the Moon. Brightness: the standard corona law, carried
  // outward along the measured zodiacal light; farther from the Sun it flattens toward the plane of the planets.
  {
    float rho = max(aS/uSunRad, 1.0);                                   // solar radii from the Sun's centre
    float Kc = 1.425*pow(rho, -7.0) + 2.565*pow(rho, -17.0);            // glowing gas
    float Fc = rho < 20.0 ? 0.0532*pow(rho, -2.5) : 2.97e-5*pow(rho/20.0, -2.2);   // dust
    vec3 tS = rd - uSun*dot(rd, uSun); float tl = length(tS);

    Lbg += vec3(1.0, 0.97, 0.92)*(uEsun/(PI*uSunRad*uSunRad))*1.0e-6*(Kc + Fc/(1.0 + 2.3*smoothstep(4.0, 60.0, rho)*off*off));
  }
  // Sun: rays that graze the atmosphere are bent toward the Earth (refraction), which lifts and flattens
  // the low part of the disc and lets sunlight from behind the Earth through the limb (red eclipse ring).
  // The pixel's span of tangent altitudes is supersampled because the bent image is far thinner than a pixel.
  vec3 Lsun = vec3(0.0);
  float hT = length(pmin) - 1.0;
  if (dot(ro, rd) >= 0.0 || hT > ATM) Lsun = sunL(rd, uPix);
  else if (cov < 1.0){
    vec3 upT = normalize(pmin); float span = max(tca, 1e-4)*uPix;
    for (int k = 0; k < 24; k++){
      float h = hT + ((float(k) + 0.5)/24.0 - 0.5)*span;
      if (h <= 0.0 || h > ATM) { if (h > ATM) Lsun += sunL(rd, 0.0); continue; }

  vec3 oc = ro - uMoon; float mb = dot(oc, rd), moc = dot(oc, oc);

      float hq = 0.0;
      if (uMoonHi > 0.0){
        // Up close the real surface is found along the ray (mountains stand out against the sky and hide what is
        // behind them); from far away the relief is smaller than a pixel and the mean sphere will do.

          float floorStep = (t1m - tm)/(uQ > 0.5 ? 40.0 : 24.0);
          for (int i = 0; i < 40; i++){

      // what the Apollo 10 crew called tan and brown. The maps carry less of that tint than the soil has, so they
      // give the differences from place to place and the soil's measured colour sets the whole.

        nrel = normalize(nm - (sE*eastM + sN*northM + cg)*uMoonHi);
        hq = moonH(muv2, mlod);
        msh = mix(1.0, csh, uMoonHi);
        // shadows cast by crater rims and mountains, where the Sun is low enough for them to be longer than a pixel
        float seM = dot(nm, uSun);

      float fph = moonPhase(dot(uSun, -rd));

      Ls += A/PI*uEsun*vec3(1.0, 0.3, 0.1)*2e-4*(1.0 - lvis)*step(0.0, m0); // red light bent through Earth's air

    }
  }

  // ---- atmosphere along the view ray: single scattering, 12 samples ----
  vec3 inS = vec3(0.0), Tv = vec3(1.0);

  float nu = dot(rd, uSun);

  const float g = 0.8;
  float phM = 3.0*(1.0-g*g)*(1.0+nu*nu)/(8.0*PI*(2.0+g*g)*pow(1.0+g*g-2.0*g*nu, 1.5));

        else { float s = 2.0*u - 1.0; float hl = (s < 0.0) ? tm - t0 : t1 - tm; t = tm + hl*s*abs(s); dt = hl*4.0*abs(s)/12.0; }

    if (d2 > 0.0){
      float s0 = max(-ab - sqrt(d2), 0.0), s1 = -ab + sqrt(d2);

      if (d1 > 0.0){ float e0 = max(-ab - sqrt(d1), 0.0), e1 = -ab + sqrt(d1); if (hit) e1 = min(e1, tg); chord -= max(e1 - e0, 0.0)*step(0.0, e1); }

  }

  // aurora: the ovals around the two magnetic poles - a faint broad band (1 kilorayleigh seen from above on a quiet

  // magnetic midnight. How strong and how far from the poles it is follows the planetary activity index when that

          vec3 wid = vec3(0.0384*(1.0 + 0.1*kq), max(7.7e-4, wpx), max(6.0e-4, wpx));
          vec3 amp = vec3(exp(0.26*kq), strong*6.0*7.7e-4/wid.y, strong*3.0*6.0e-4/wid.z)/27.0;

            vec3 g = night*vec3(1.0, 0.6 + 0.4*sin(5.0*ph + uOff.x*30.0), 0.6 + 0.4*sin(7.0*ph + 2.0 - uOff.y*26.0));

  // ---- composite ----
  vec3 Lunder = mix(Lbg, Lg, cov);

    vec3 md = normalize(uMoon - p); float num = dot(rd, md);

    float pM = 3.0*(1.0-g*g)*(1.0+num*num)/(8.0*PI*(2.0+g*g)*pow(1.0+g*g-2.0*g*num, 1.5));
    float am = min(chap(1.0/HR, max(dot(n, -rd), 0.02)), 40.0);
    vec3 tv = BR*HR*am; float tvm = BMS*HM*min(chap(1.0/HM, max(dot(n,-rd),0.02)), 40.0);
    col += uEmoon*(pR*BR*HR + pM*BMS*HM)*am*(1.0 - exp(-tv - tvm))/(tv + tvm)

  }
  if (moonFront) col = Lmoon;

function astro(ms){

  const phiE = (Math.sin(alphaE) + (Math.PI - alphaE)*Math.cos(alphaE))/Math.PI;

  const Pm = precession(T);
  const J2W = [0,1,2].map(i => eqToWorld([Pm[0][i], Pm[1][i], Pm[2][i]]));   // columns
  const J2Wr = T3(J2W);                                                        // as row-major matrix
  const W2G = mulMM(GAL, T3(J2Wr));

    const ph = helio(PLANETS[name], T), g = sub(ph, eb);
    const rr = len(ph), DD = len(g);
    const ca = dot(sc(ph,-1), sub(eb, ph))/(rr*len(sub(eb,ph)));

/* ------------------------------------------------------------------ generated weather */

  const tt = T % 100000, off = [31.7 + tt*0.011, 12.3 + tt*0.007, 57.1 + tt*0.009];
  const storms = new Float32Array(32), L = 96;
  for (let i = 0; i < 8; i++){
    const a = T + i*L/8, gen = Math.floor(a/L), age = a - gen*L, s = Math.sin(Math.PI*age/L);
    const hem = h1(gen*7.0 + i) > 0.5 ? 1 : -1;
    const latD = (36 + 22*h1(gen*13.0 + i*3.0) + 0.05*age)*hem;
    const lon = h1(gen*17.0 + i*5.0)*2*Math.PI + 0.011*age/Math.cos(latD*D2R);
    const la = latD*D2R;
    storms.set([Math.cos(la)*Math.sin(lon), Math.sin(la), Math.cos(la)*Math.cos(lon), s*hem*(0.6 + 0.4*h1(gen*3.1 + i))], i*4);
